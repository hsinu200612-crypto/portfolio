                                // ポップアップを開く関数

                                document.getElementById('popup1').style.display = 'none';

                                    closePopup();
                                }

                                // ESCキーでポップアップを閉じる
                                document.addEventListener('keydown', function(event) {
                                if (event.key === 'Escape') {

                                }
                                });
